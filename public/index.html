<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚦 Red Light, Green Light!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== SPLASH / START SCREEN ===== -->
  <div id="screen-start" class="screen active">
    <div class="splash-doll">🪆</div>
    <h1 class="game-title">Red Light,<br>Green Light!</h1>
    <p class="subtitle">Freeze when you see 🔴 Red!<br>Move when you see 🟢 Green!</p>
    <div class="camera-notice">📷 You'll need your camera</div>
    <div class="difficulty-select">
      <label>Choose Difficulty:</label>
      <div class="diff-buttons">
        <button class="diff-btn active" data-diff="easy">😊 Easy</button>
        <button class="diff-btn" data-diff="medium">😤 Medium</button>
        <button class="diff-btn" data-diff="hard">😈 Hard</button>
      </div>
    </div>
    <button id="btn-start" class="btn-main pulse">▶ Play Now!</button>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="screen-game" class="screen">

    <!-- HUD -->
    <div id="hud">
      <div id="hud-lives">
        <span class="hud-label">Lives</span>
        <div id="lives-display"></div>
      </div>
      <div id="hud-score">
        <span class="hud-label">Score</span>
        <span id="score-value">0</span>
      </div>
      <div id="hud-round">
        <span class="hud-label">Round</span>
        <span id="round-value">1</span>
      </div>
    </div>

    <!-- Main Game Area -->
    <div id="game-area">

      <!-- Traffic Light -->
      <div id="traffic-light">
        <div class="light-housing">
          <div class="light" id="light-red"></div>
          <div class="light" id="light-green"></div>
        </div>
        <div class="light-post"></div>
      </div>

      <!-- Doll Character -->
      <div id="doll-container">
        <div id="doll" class="doll-front">🪆</div>
        <div id="doll-speech"></div>
      </div>

      <!-- Camera + Canvas -->
      <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="pose-canvas"></canvas>
        <div id="movement-indicator"></div>
        <div id="camera-overlay">
          <div id="scan-line"></div>
        </div>
      </div>

    </div>

    <!-- Status Banner -->
    <div id="status-banner">
      <span id="status-text">Get Ready...</span>
    </div>

    <!-- Countdown -->
    <div id="countdown-overlay" class="hidden">
      <div id="countdown-number"></div>
    </div>

    <!-- Caught Flash -->
    <div id="caught-overlay" class="hidden">
      <div class="caught-text">❌ YOU MOVED!</div>
    </div>

  </div>

  <!-- ===== WIN SCREEN ===== -->
  <div id="screen-win" class="screen">
    <div class="result-emoji">🎉</div>
    <h2 class="result-title">You Win!</h2>
    <p class="result-msg">Amazing job! You survived all rounds!</p>
    <div class="final-score">Score: <span id="win-score">0</span></div>
    <button id="btn-play-again-win" class="btn-main pulse">▶ Play Again</button>
  </div>

  <!-- ===== LOSE SCREEN ===== -->
  <div id="screen-lose" class="screen">
    <div class="result-emoji shake-emoji">😱</div>
    <h2 class="result-title">Game Over!</h2>
    <p class="result-msg">You got caught moving on Red Light!</p>
    <div class="final-score">Score: <span id="lose-score">0</span></div>
    <button id="btn-play-again-lose" class="btn-main pulse">▶ Try Again</button>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- TensorFlow.js + MoveNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>

  <script src="audio.js"></script>
  <script src="detector.js"></script>
  <script src="ui.js"></script>
  <script src="game.js"></script>
</body>
</html>
